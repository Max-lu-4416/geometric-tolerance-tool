<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公差查询工具 · UI 前后对照</title><style>body{margin:24px;background:#f5f6f8;color:#20252b;font:14px "Microsoft YaHei UI",sans-serif}h1{font-size:24px;font-weight:500;margin:0 0 12px}p{color:#505c68;line-height:1.8}select{padding:8px 12px;margin:0 12px 16px 0;border:1px solid #d8dee5;background:white;color:#20252b}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}figcaption{margin:0 0 8px;color:#505c68}img{width:100%;border:1px solid #d8dee5;background:white}a{color:#245ddb}@media(max-width:1000px){main{grid-template-columns:1fr}}</style><h1>公差查询工具 · UI 前后对照</h1><p>v1.2 → v1.3。两侧均使用大号字体，来自程序内 WPF 直接渲染。查询参数一致；分类标识、计算与复制行为保持兼容。</p><label>页面 <select id="page"><option value="shaft">轴偏差</option><option value="hole">孔偏差</option><option value="shaft-fit">基轴制配合</option><option value="hole-fit">基孔制配合</option><option value="geometry">形位公差</option><option value="settings">设置</option></select></label><label>主题 <select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label><main><figure><figcaption>优化前 · v1.2</figcaption><img id="before" alt="优化前"></figure><figure><figcaption>优化后 · v1.3</figcaption><img id="after" alt="优化后"></figure></main><p>设计流程参考 <a href="https://github.com/heydamir/unslop">unslop</a> · Damir Sokolovsky（@heydamir） · CC BY 4.0</p><script>const page=document.getElementById('page'),theme=document.getElementById('theme');function update(){for(const side of ['before','after'])document.getElementById(side).src='comparison-assets/'+side+'-'+page.value+'-'+theme.value+'.png'}page.onchange=theme.onchange=update;update();</script></html>
